<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ビジュアル式ハイパーしりとり</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .title {
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 10px rgba(255, 255, 255, 0.5); }
            to { text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 255, 255, 0.8); }
        }

        .input-container {
            margin-bottom: 40px;
            z-index: 1000;
        }

        input[type="text"] {
            padding: 15px 25px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            width: 300px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .words-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0;
            width: 80%;
            max-width: 800px;
            margin: 0 auto;
            padding-left: 100px;
        }

        .word-group {
            display: flex;
            gap: 10px;
            animation: wordAppear 0.6s ease-out;
            position: relative;
            margin-bottom: 5px;
        }

        .word-group.connected {
            margin-top: -15px;
        }

        @keyframes wordAppear {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .letter-block {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            color: #333;
            box-shadow: 
                5px 5px 15px rgba(0, 0, 0, 0.2),
                -5px -5px 15px rgba(255, 255, 255, 0.7),
                inset 1px 1px 3px rgba(255, 255, 255, 0.6);
            position: relative;
            animation: float 3s ease-in-out infinite;
            transition: all 0.3s ease;
        }

        .letter-block:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .letter-block.fade-out {
            opacity: 0.3;
            transform: scale(0.8);
            filter: blur(2px);
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-5px) rotate(1deg);
            }
            50% {
                transform: translateY(0) rotate(-1deg);
            }
            75% {
                transform: translateY(-3px) rotate(0.5deg);
            }
        }

        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 20px;
            font-size: 1.5em;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: errorShake 0.5s ease-out;
            z-index: 2000;
        }

        @keyframes errorShake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-48%, -50%) rotate(-2deg); }
            50% { transform: translate(-52%, -50%) rotate(2deg); }
            75% { transform: translate(-48%, -50%) rotate(-1deg); }
        }

        .game-setup {
            text-align: center;
        }

        .player-selection {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .player-btn {
            padding: 15px 30px;
            font-size: 1.5em;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
        }

        .player-btn:hover {
            transform: scale(1.05);
            box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.3);
        }

        .current-player-info {
            text-align: center;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .players-area {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            z-index: 1000;
        }

        .player-info {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 20px;
            color: white;
            font-size: 1em;
            display: none;
        }

        .player-info.active {
            background: rgba(255, 215, 0, 0.3);
            border: 2px solid #FFD700;
        }

        .player-name {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .player-letters {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .captured-letter-item {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 8px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .instructions {
            color: white;
            font-size: 1.1em;
            margin-bottom: 20px;
            text-align: center;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1 class="title">ビジュアル式ハイパーしりとり</h1>
    
    <div id="gameSetup" class="game-setup">
        <p class="instructions">プレイヤー数を選択してください</p>
        <div class="player-selection">
            <button class="player-btn" onclick="startGame(2)">2人</button>
            <button class="player-btn" onclick="startGame(3)">3人</button>
            <button class="player-btn" onclick="startGame(4)">4人</button>
        </div>
    </div>
    
    <div id="gamePlay" class="game-play" style="display: none;">
        <div class="current-player-info">
            <span id="currentPlayerText">プレイヤー1のターン</span>
        </div>
        <div class="input-container">
            <input type="text" id="wordInput" placeholder="例: りんご">
        </div>
    </div>
    
    <div class="words-container" id="wordsContainer"></div>
    
    <div class="players-area" id="playersArea"></div>

    <script>
        const wordInput = document.getElementById('wordInput');
        const wordsContainer = document.getElementById('wordsContainer');
        let lastChar = '';
        let players = [];
        let currentPlayerIndex = 0;
        let gameStarted = false;

        // ゲーム開始
        function startGame(playerCount) {
            players = [];
            for (let i = 1; i <= playerCount; i++) {
                players.push({
                    id: i,
                    name: `プレイヤー${i}`,
                    capturedLetters: []
                });
            }
            currentPlayerIndex = 0;
            gameStarted = true;
            
            document.getElementById('gameSetup').style.display = 'none';
            document.getElementById('gamePlay').style.display = 'block';
            
            createPlayersArea();
            updateCurrentPlayer();
            wordInput.focus();
        }

        // プレイヤーエリア作成
        function createPlayersArea() {
            const playersArea = document.getElementById('playersArea');
            playersArea.innerHTML = '';
            
            players.forEach((player, index) => {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'player-info';
                playerDiv.id = `player${player.id}`;
                playerDiv.style.display = 'block';
                
                playerDiv.innerHTML = `
                    <div class="player-name">${player.name}</div>
                    <div>持ち文字数: <span id="count${player.id}">0</span></div>
                    <div class="player-letters" id="letters${player.id}"></div>
                `;
                
                playersArea.appendChild(playerDiv);
            });
        }

        // 現在のプレイヤー表示更新
        function updateCurrentPlayer() {
            document.getElementById('currentPlayerText').textContent = 
                `${players[currentPlayerIndex].name}のターン`;
            
            // プレイヤーエリアのアクティブ表示
            players.forEach((player, index) => {
                const playerDiv = document.getElementById(`player${player.id}`);
                if (index === currentPlayerIndex) {
                    playerDiv.classList.add('active');
                } else {
                    playerDiv.classList.remove('active');
                }
            });
        }

        // プレイヤーの文字表示更新
        function updatePlayerDisplay(playerId) {
            const player = players.find(p => p.id === playerId);
            const countElement = document.getElementById(`count${playerId}`);
            const lettersElement = document.getElementById(`letters${playerId}`);
            
            countElement.textContent = player.capturedLetters.length;
            lettersElement.innerHTML = player.capturedLetters.map(letter => 
                `<span class="captured-letter-item">${letter}</span>`
            ).join('');
        }

        // 文字ブロック生成
        function createLetterBlock(letter) {
            const block = document.createElement('div');
            block.className = 'letter-block';
            block.textContent = letter;
            
            const hue = Math.random() * 360;
            block.style.background = `linear-gradient(145deg, 
                hsl(${hue}, 70%, 85%), 
                hsl(${hue}, 70%, 75%))`;
            
            return block;
        }

        // エラー表示
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            document.body.appendChild(errorDiv);
            
            setTimeout(() => {
                errorDiv.remove();
            }, 2000);
        }

        // 複数文字の重なりを検出
        function findOverlap(prevWord, newWord) {
            const maxOverlap = Math.min(prevWord.length, newWord.length);
            
            for (let i = maxOverlap; i >= 1; i--) {
                const prevSuffix = prevWord.slice(-i);
                const newPrefix = newWord.slice(0, i);
                
                if (prevSuffix === newPrefix) {
                    return {
                        length: i,
                        text: prevSuffix
                    };
                }
            }
            
            return null;
        }


        // 単語を追加
        function addWord(word, prevWord = '') {
            const wordGroup = document.createElement('div');
            wordGroup.className = 'word-group';
            
            // 2つ目以降の単語で重なりを検出して奪う
            if (wordsContainer.children.length > 0 && prevWord) {
                const overlap = findOverlap(prevWord, word);
                
                if (overlap) {
                    wordGroup.classList.add('connected');
                    
                    // 前の単語から重なった文字数分をフェードアウト
                    const prevWordGroup = wordsContainer.lastElementChild;
                    const prevBlocks = Array.from(prevWordGroup.children);
                    
                    const currentPlayer = players[currentPlayerIndex];
                    for (let i = 0; i < overlap.length; i++) {
                        const blockIndex = prevBlocks.length - overlap.length + i;
                        if (prevBlocks[blockIndex]) {
                            prevBlocks[blockIndex].classList.add('fade-out');
                            currentPlayer.capturedLetters.push(prevBlocks[blockIndex].textContent);
                        }
                    }
                    
                    console.log(`重なり検出: "${overlap.text}" (${overlap.length}文字) - ${currentPlayer.name}が獲得`);
                    updatePlayerDisplay(currentPlayer.id);
                }
            }
            
            // 文字を1つずつブロックにして追加
            for (let i = 0; i < word.length; i++) {
                const letterBlock = createLetterBlock(word[i]);
                letterBlock.style.animationDelay = `${i * 0.1}s`;
                wordGroup.appendChild(letterBlock);
            }
            
            wordsContainer.appendChild(wordGroup);
            
            // 最後の文字を更新
            lastChar = word[word.length - 1];
            
            // スクロール
            wordGroup.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // 入力欄をクリアしてフォーカス
            wordInput.value = '';
            wordInput.focus();
        }

        // エンターキーで処理
        wordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const word = wordInput.value.trim();
                if (!word) return;
                
                if (!gameStarted) return;
                
                if (wordsContainer.children.length === 0) {
                    // 最初の単語
                    addWord(word, '');
                    lastChar = word[word.length - 1];
                } else {
                    // 2つ目以降：重なりをチェック
                    const prevWordGroup = wordsContainer.lastElementChild;
                    const prevWord = Array.from(prevWordGroup.children)
                        .map(block => block.textContent).join('');
                    
                    const overlap = findOverlap(prevWord, word);
                    
                    if (overlap) {
                        addWord(word, prevWord);
                        lastChar = word[word.length - 1];
                    } else {
                        showError(`前の単語と重なる部分がありません！`);
                        wordInput.value = '';
                        wordInput.focus();
                        return;
                    }
                }
                
                // 次のプレイヤーに交代
                currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
                updateCurrentPlayer();
                
                // スクロール
                const wordGroup = wordsContainer.lastElementChild;
                wordGroup.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
                // 入力欄をクリアしてフォーカス
                wordInput.value = '';
                wordInput.focus();
            }
        });

        // ページロード時の初期化
        window.addEventListener('load', () => {
            // ゲーム開始前は入力欄を無効化
        });
    </script>
</body>
</html>
